<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whack-a-Mole | Rohith-Shimori</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #ff5e00;
      --accent-soft: #ffb347;
      --hole: #21262d;
      --hole-border: #30363d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1c2636, var(--bg) 45%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 1rem;
    }

    .game {
      width: min(760px, 100%);
      background: color-mix(in oklab, var(--panel) 94%, black);
      border: 1px solid var(--hole-border);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 20px 40px rgb(0 0 0 / 0.35);
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.35rem, 2vw + 0.8rem, 2rem);
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .topbar {
      margin-top: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .score {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    button,
    a.button-link {
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
    }

    button.secondary,
    a.button-link.secondary {
      background: transparent;
      border-color: var(--hole-border);
      color: var(--text);
    }

    .board {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(88px, 1fr));
      gap: 0.75rem;
    }

    .hole {
      position: relative;
      height: clamp(84px, 21vw, 130px);
      background: linear-gradient(180deg, #2a3038, var(--hole));
      border: 1px solid var(--hole-border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 120ms ease;
      touch-action: manipulation;
    }

    .hole:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 2px;
    }

    .hole:active { transform: scale(0.98); }

    .hole::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 12px;
      height: 18px;
      border-radius: 999px;
      background: #0f141a;
      border: 1px solid #3b434d;
    }

    .mole {
      position: absolute;
      left: 50%;
      bottom: -38px;
      width: clamp(46px, 10vw, 72px);
      aspect-ratio: 1;
      transform: translateX(-50%) translateY(0);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe5bb, #f3c98b 65%, #dfaa64);
      transition: transform 150ms ease;
      pointer-events: none;
    }

    .mole::before,
    .mole::after {
      content: "";
      position: absolute;
      top: 14%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1b1f23;
    }

    .mole::before { left: 28%; }
    .mole::after { right: 28%; }

    .hole.active .mole { transform: translateX(-50%) translateY(-52px); }
    .hole.whacked .mole {
      transform: translateX(-50%) translateY(-30px) scale(0.9);
      filter: brightness(0.82) saturate(0.75);
    }

    .hammer-hit {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      color: var(--accent-soft);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 130ms ease, transform 130ms ease;
      pointer-events: none;
    }

    .hole.whacked .hammer-hit {
      opacity: 1;
      transform: scale(1);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Whack-a-Mole</h1>
    <p class="meta">Tap or click moles as they pop up. Responsive, dependency-free, and repo-hosted.</p>

    <div class="topbar">
      <p class="score" id="scoreText">Score: 0</p>
      <div class="actions">
        <button id="startBtn" type="button">Start</button>
        <button id="resetBtn" type="button" class="secondary">Reset</button>
        <a class="button-link secondary" href="../README.md">Back to README</a>
      </div>
    </div>

    <p id="scoreLive" class="sr-only" aria-live="polite" aria-atomic="true">Score is 0</p>

    <section class="board" id="board" aria-label="Whack-a-Mole game board">
      <button class="hole" type="button" aria-label="Hole 1"><span class="mole"></span><span class="hammer-hit">✦</span></button>
      <button class="hole" type="button" aria-label="Hole 2"><span class="mole"></span><span class="hammer-hit">✦</span></button>
      <button class="hole" type="button" aria-label="Hole 3"><span class="mole"></span><span class="hammer-hit">✦</span></button>
      <button class="hole" type="button" aria-label="Hole 4"><span class="mole"></span><span class="hammer-hit">✦</span></button>
      <button class="hole" type="button" aria-label="Hole 5"><span class="mole"></span><span class="hammer-hit">✦</span></button>
      <button class="hole" type="button" aria-label="Hole 6"><span class="mole"></span><span class="hammer-hit">✦</span></button>
      <button class="hole" type="button" aria-label="Hole 7"><span class="mole"></span><span class="hammer-hit">✦</span></button>
      <button class="hole" type="button" aria-label="Hole 8"><span class="mole"></span><span class="hammer-hit">✦</span></button>
      <button class="hole" type="button" aria-label="Hole 9"><span class="mole"></span><span class="hammer-hit">✦</span></button>
    </section>
  </main>

  <script>
    const holes = Array.from(document.querySelectorAll('.hole'));
    const scoreText = document.getElementById('scoreText');
    const scoreLive = document.getElementById('scoreLive');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    let score = 0;
    let activeIndex = -1;
    let loopTimer;
    let running = false;

    const updateScore = () => {
      scoreText.textContent = `Score: ${score}`;
      scoreLive.textContent = `Score is ${score}`;
    };

    const clearActiveHole = () => {
      if (activeIndex >= 0) {
        holes[activeIndex].classList.remove('active');
      }
      activeIndex = -1;
    };

    const popRandomMole = () => {
      clearActiveHole();
      activeIndex = Math.floor(Math.random() * holes.length);
      holes[activeIndex].classList.add('active');
    };

    const startGame = () => {
      if (running) return;
      running = true;
      startBtn.textContent = 'Running';
      startBtn.disabled = true;
      popRandomMole();
      loopTimer = window.setInterval(popRandomMole, 720);
    };

    const resetGame = () => {
      window.clearInterval(loopTimer);
      running = false;
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
      clearActiveHole();
      holes.forEach((hole) => hole.classList.remove('whacked'));
      score = 0;
      updateScore();
    };

    holes.forEach((hole, index) => {
      hole.addEventListener('click', () => {
        if (!running || index !== activeIndex) return;
        score += 1;
        updateScore();
        hole.classList.add('whacked');
        window.setTimeout(() => hole.classList.remove('whacked'), 140);
        clearActiveHole();
      });
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);
    updateScore();
  </script>
</body>
</html>
