name: Generate Whack-a-Mole SVGs

on:
  schedule:
    # Run every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate animated whack-a-mole SVG variants
        run: |
          mkdir -p dist

          # Orange variant (default preview)
          cat <<'SVG' > dist/whack-a-mole-orange.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
            <title id="title">Whack-a-Mole Contributions Preview - Orange</title>
            <desc id="desc">Animated whack-a-mole style banner in orange color.</desc>
            <rect width="800" height="220" fill="#0d1117"/>
            <text x="30" y="45" fill="#FF5E00" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Whack-a-Mole Contributions</text>
            <text x="30" y="78" fill="#c9d1d9" font-size="18" font-family="Segoe UI, Arial, sans-serif">Orange variant</text>
            <rect x="80" y="150" width="120" height="22" rx="10" fill="#161b22" stroke="#30363d"/>
            <rect x="280" y="150" width="120" height="22" rx="10" fill="#161b22" stroke="#30363d"/>
            <rect x="480" y="150" width="120" height="22" rx="10" fill="#161b22" stroke="#30363d"/>
            <circle cx="140" cy="148" r="18" fill="#FF5E00">
              <animate attributeName="cy" values="148;120;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="340" cy="148" r="18" fill="#FF5E00">
              <animate attributeName="cy" values="148;148;118;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="540" cy="148" r="18" fill="#FF5E00">
              <animate attributeName="cy" values="148;118;148;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <rect x="700" y="95" width="22" height="80" rx="10" fill="#FF5E00">
              <animateTransform attributeName="transform" type="rotate" values="-18 711 170;20 711 170;-18 711 170" dur="1.2s" repeatCount="indefinite"/>
            </rect>
          </svg>
          SVG

          # Red variant
          cat <<'SVG' > dist/whack-a-mole-red.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
            <title id="title">Whack-a-Mole Contributions Preview - Red</title>
            <desc id="desc">Animated whack-a-mole style banner in red color.</desc>
            <rect width="800" height="220" fill="#0d1117"/>
            <text x="30" y="45" fill="#FF3333" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Whack-a-Mole Contributions</text>
            <text x="30" y="78" fill="#c9d1d9" font-size="18" font-family="Segoe UI, Arial, sans-serif">Red variant</text>
            <rect x="80" y="150" width="120" height="22" rx="10" fill="#161b22" stroke="#30363d"/>
            <rect x="280" y="150" width="120" height="22" rx="10" fill="#161b22" stroke="#30363d"/>
            <rect x="480" y="150" width="120" height="22" rx="10" fill="#161b22" stroke="#30363d"/>
            <circle cx="140" cy="148" r="18" fill="#FF3333">
              <animate attributeName="cy" values="148;120;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="340" cy="148" r="18" fill="#FF3333">
              <animate attributeName="cy" values="148;148;118;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="540" cy="148" r="18" fill="#FF3333">
              <animate attributeName="cy" values="148;118;148;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <rect x="700" y="95" width="22" height="80" rx="10" fill="#FF3333">
              <animateTransform attributeName="transform" type="rotate" values="-18 711 170;20 711 170;-18 711 170" dur="1.2s" repeatCount="indefinite"/>
            </rect>
          </svg>
          SVG

          # Black variant
          cat <<'SVG' > dist/whack-a-mole-black.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
            <title id="title">Whack-a-Mole Contributions Preview - Black</title>
            <desc id="desc">Animated whack-a-mole style banner in black color.</desc>
            <rect width="800" height="220" fill="#f6f8fa"/>
            <text x="30" y="45" fill="#000000" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Whack-a-Mole Contributions</text>
            <text x="30" y="78" fill="#57606a" font-size="18" font-family="Segoe UI, Arial, sans-serif">Black variant</text>
            <rect x="80" y="150" width="120" height="22" rx="10" fill="#ffffff" stroke="#d0d7de"/>
            <rect x="280" y="150" width="120" height="22" rx="10" fill="#ffffff" stroke="#d0d7de"/>
            <rect x="480" y="150" width="120" height="22" rx="10" fill="#ffffff" stroke="#d0d7de"/>
            <circle cx="140" cy="148" r="18" fill="#000000">
              <animate attributeName="cy" values="148;120;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="340" cy="148" r="18" fill="#000000">
              <animate attributeName="cy" values="148;148;118;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="540" cy="148" r="18" fill="#000000">
              <animate attributeName="cy" values="148;118;148;148" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <rect x="700" y="95" width="22" height="80" rx="10" fill="#000000">
              <animateTransform attributeName="transform" type="rotate" values="-18 711 170;20 711 170;-18 711 170" dur="1.2s" repeatCount="indefinite"/>
            </rect>
          </svg>
          SVG

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
